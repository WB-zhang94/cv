          - "Dissertation: The Co-Evolutionary Mechanism Between Urban Planning and Self-Organized Urban Development: A Case Study of Nanjing, 1979–2020"
          - "Developed a theoretical framework to explain the interaction between formal planning institutions and self-organised urban development over time."
          - "Analysed how policy intervention, spatial regulation, administrative decision-making, and bottom-up development dynamics jointly shape governance outcomes."
          - "Conducted an in-depth longitudinal case study of Nanjing across multiple phases of institutional, policy, and urban transformation."

