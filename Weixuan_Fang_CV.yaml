  sections:
    profile:
      - "Policy researcher with a PhD in Urban Policy, specialising in the interaction between formal governance arrangements, spatial regulation, and self-organised development dynamics. My doctoral research developed a co-evolutionary framework to analyse how planning institutions and bottom-up urban processes shape one another over time. I combine theoretical framework-building, qualitative case analysis, comparative reasoning, and quantitative/spatial methods to study complex policy and governance processes. I am particularly interested in how institutional design and administrative systems affect policy implementation, public-facing governance, and social outcomes."

